spring.application.name=exelens-backend

# 업로드 가능한 파일 최대 크기 (너무 큰 파일로 서버가 느려지거나 멈추는 것을 막기 위한 제한)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# 분석 모듈(Python) 호출 설정
# - python 명령어 이름은 운영체제/환경마다 다를 수 있어 설정으로 분리했다 (python, python3 등)
# - 분석 스크립트 경로는 이 서버 기준 상대 경로. 서버를 backend 폴더에서 실행한다고 가정한다.
exelens.analyzer.python-executable=python
exelens.analyzer.script-path=../analyzer/console_analyzer.py
exelens.analyzer.timeout-seconds=30

# 데이터베이스 설정 (4단계)
# - 개발 초기에는 H2를 쓴다 (README 7장). 서비스 확장 단계에서 PostgreSQL로 교체할 예정이다.
# - 파일 기반(jdbc:h2:file:...)으로 저장해서, 서버를 껐다 켜도 분석 이력이 남아있게 한다.
spring.datasource.url=jdbc:h2:file:./data/exelens
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ddl-auto=update : 엔티티 클래스를 보고 테이블을 자동으로 만들어준다 (학습/개발 단계에서만 사용 권장).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# 브라우저에서 http://localhost:8080/h2-console 로 접속하면 DB 내용을 직접 눈으로 확인할 수 있다.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
